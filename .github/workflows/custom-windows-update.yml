name: Custom Windows update

on:
  push:
    branches:
      - custom/orca-dashboard-live-view
      - custom/orca-conflict-reduction
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: custom-windows-update
  cancel-in-progress: false

jobs:
  inputs:
    if: github.repository == 'andremohrmann/orca'
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.snapshot.outputs.upstream }}
      matrix: ${{ steps.snapshot.outputs.matrix }}
    steps:
      - name: Pin one upstream snapshot and both branch heads
        id: snapshot
        uses: actions/github-script@v8
        with:
          script: |
            const upstream = await github.rest.git.getRef({ owner: 'stablyai', repo: 'orca', ref: 'heads/main' });
            const branches = [
              { branch: 'custom/orca-dashboard-live-view', label: 'production', publish: true },
              { branch: 'custom/orca-conflict-reduction', label: 'experiment', publish: false }
            ];
            const selected = context.eventName === 'push'
              ? branches.filter(item => `refs/heads/${item.branch}` === context.ref)
              : branches;
            for (const item of selected) {
              const ref = await github.rest.git.getRef({ ...context.repo, ref: `heads/${item.branch}` });
              item.head = context.eventName === 'push' ? context.sha : ref.data.object.sha;
            }
            core.setOutput('upstream', upstream.data.object.sha);
            core.setOutput('matrix', JSON.stringify({ include: selected }));
            await core.summary.addHeading('Paired upstream merge inputs')
              .addRaw(`Upstream: ${upstream.data.object.sha}\n`)
              .addTable([
                [{ data: 'Branch', header: true }, { data: 'Input commit', header: true }],
                ...selected.map(item => [item.branch, item.head])
              ]).write();

  build:
    name: ${{ matrix.label }}
    needs: inputs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inputs.outputs.matrix) }}
    if: github.repository != 'stablyai/orca'
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      CUSTOM_BRANCH: ${{ matrix.branch }}
      PINNED_UPSTREAM: ${{ needs.inputs.outputs.upstream }}
      MERGE_REPORT: ${{ runner.temp }}/merge-observation.json
      ORCA_BACKGROUND_LAUNCH: '1'
      UPSTREAM_REPO: https://github.com/stablyai/orca.git
      OUTPUT_DIR: ${{ github.workspace }}\custom-output

    steps:
      - name: Check out custom branch
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Add upstream remote
        shell: pwsh
        run: |
          git remote remove upstream 2>$null || $true
          git remote add upstream "$env:UPSTREAM_REPO"
          git switch -c "$env:CUSTOM_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.34.6
          corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Windows installer tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = @(
            @{ Tag = '7zip@1.0.0'; File = '7zip-win-x64.tar.gz'; Sha256 = 'be071f15bd6da2f78fe81c6ddef2009b0c4d8a51f36b780cb806c7e6df95e1b3' },
            @{ Tag = 'nsis-resources-3.4.1'; File = 'nsis-resources-3.4.1.7z'; Sha256 = '593a9a92ef958321293ac6a2ee61e64bf1bd543142a5bd6b3d310709cc924103' }
          )
          foreach ($tool in $tools) {
            $cacheDir = Join-Path $env:LOCALAPPDATA "electron-builder/Cache/$($tool.Tag)"
            New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
            gh release download $tool.Tag `
              --repo electron-userland/electron-builder-binaries `
              --pattern $tool.File `
              --dir $cacheDir `
              --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download $($tool.File) through the GitHub release API."
            }
            $archive = Join-Path $cacheDir $tool.File
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $tool.Sha256) {
              throw "$($tool.File) checksum does not match electron-builder."
            }
          }

      - name: Validate and build installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $mergeOptions = @()
          if ('${{ github.event_name }}' -eq 'push') {
            $mergeOptions += '-SkipUpstreamMerge'
          }
          powershell -ExecutionPolicy Bypass -File config/scripts/build-custom-orca-update.ps1 @mergeOptions `
            -Branch "$env:CUSTOM_BRANCH" `
            -Upstream upstream/main `
            -UpstreamCommit "$env:PINNED_UPSTREAM" `
            -MergeReportPath "$env:MERGE_REPORT" `
            -OutputDir "$env:OUTPUT_DIR" `
            -UpdateOwner "${{ github.repository_owner }}" `
            -UpdateRepo "${{ github.event.repository.name }}" `
            -StampCustomVersion

      - name: Push updated custom branch
        shell: pwsh
        run: |
          git push origin HEAD:$env:CUSTOM_BRANCH
          $localHead = git rev-parse HEAD
          $remoteHead = (git ls-remote origin "refs/heads/$env:CUSTOM_BRANCH").Split("`t")[0]
          if ($remoteHead -ne $localHead) {
            throw "Published branch head $remoteHead does not match built commit $localHead."
          }

      - name: Compute release metadata
        if: matrix.publish
        id: release
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath "$env:OUTPUT_DIR\latest.yml" -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $shortSha = git rev-parse --short=12 HEAD
          $tag = "custom-windows-$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=Custom Orca Windows $version ($shortSha)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        if: matrix.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Custom Orca Windows build.

          Upstream repository: stablyai/orca
          Custom branch: $env:CUSTOM_BRANCH@$(git rev-parse --short=12 HEAD)
          "@
          gh release create "${{ steps.release.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            "$env:OUTPUT_DIR\orca-windows-setup.exe" `
            "$env:OUTPUT_DIR\orca-windows-setup.exe.blockmap" `
            "$env:OUTPUT_DIR\latest.yml" `
            --title "${{ steps.release.outputs.title }}" `
            --notes "$notes" `
            --target "$env:CUSTOM_BRANCH" `
            --latest

      - name: Verify published release assets
        if: matrix.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view "${{ steps.release.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            --json assets `
            | ConvertFrom-Json
          $latestTag = (gh release list --repo "${{ github.repository }}" --limit 1 --json tagName | ConvertFrom-Json)[0].tagName
          if ($latestTag -ne '${{ steps.release.outputs.tag }}') {
            throw 'Custom release was not marked as latest.'
          }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in @('orca-windows-setup.exe', 'orca-windows-setup.exe.blockmap', 'latest.yml')) {
            if ($assetNames -notcontains $required) {
              throw "Custom release is missing asset $required."
            }
          }

      - name: Record build and advancement outcome
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          INPUT_HEAD: ${{ matrix.head }}
        run: |
          $report = if (Test-Path -LiteralPath $env:MERGE_REPORT) {
            Get-Content -Raw -LiteralPath $env:MERGE_REPORT | ConvertFrom-Json -AsHashtable
          } else {
            @{ schema = 2; state = 'not-attempted'; branch = $env:CUSTOM_BRANCH; inputHead = $env:INPUT_HEAD; upstream = $env:PINNED_UPSTREAM }
          }
          $report['jobStatus'] = $env:JOB_STATUS
          $report['resultHead'] = git rev-parse HEAD
          $report['runId'] = $env:GITHUB_RUN_ID
          $report['runAttempt'] = $env:GITHUB_RUN_ATTEMPT
          $report['event'] = $env:GITHUB_EVENT_NAME
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $env:MERGE_REPORT -Encoding utf8

      - name: Save merge comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-observation-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MERGE_REPORT }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload optional CI copy of installer
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: custom-orca-windows-${{ matrix.label }}-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}\orca-windows-setup.exe
            ${{ env.OUTPUT_DIR }}\orca-windows-setup.exe.blockmap
            ${{ env.OUTPUT_DIR }}\latest.yml
